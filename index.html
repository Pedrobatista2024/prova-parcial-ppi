<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Apresentação</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        header {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 15px 0 0 0;
        }

        nav ul li {
            display: inline;
            margin: 0 15px;
        }

        nav ul li a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        section {
            padding: 40px 20px;
        }

        img {
            max-width: 320px;
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin: 20px auto;
        }

        .botao {
            display: inline-block;
            background-color: #3498db;
            color: #ffffff;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .botao:hover {
            background-color: #1d6fa5;
        }
    </style>
</head>
<body>

    <header>
        <h1>Pedro Batista</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="pagina2.html">Mais Informações</a></li>
            </ul>
        </nav>
    </header>

    <section id="sobre">
        <h2>Apresentação</h2>
        <p>Olá! Sejam bem-vindos à minha página pessoal criada para demonstrar conceitos básicos de desenvolvimento web.</p>
        
        <img src="https://images.unsplash.com/photo-1523240795612-9a054b0db644?w=600" alt="Estudantes reunidos estudando">
        
        <a href="pagina2.html" class="botao">Ir para a Página 2</a>
    </section>

</body>
</html>
